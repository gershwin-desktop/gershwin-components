<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="32" height="32" viewBox="0 0 32 32">
  <style>.ramp { fill: url(#ramp); }</style>
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <symbol id="tile"><rect width="16" height="16" fill="#00ff00"/></symbol>
    <clipPath id="dot"><circle cx="8" cy="24" r="4"/></clipPath>
    <mask id="half"><rect x="16" y="16" width="8" height="16" fill="#ffffff"/></mask>
  </defs>
  <!-- CSS and a gradient, top left -->
  <rect class="ramp" width="16" height="16"/>
  <!-- use of a symbol, top right -->
  <use xlink:href="#tile" x="16" y="0"/>
  <!-- clip path, bottom left -->
  <rect y="16" width="16" height="16" fill="#0000ff" clip-path="url(#dot)"/>
  <!-- mask, bottom right -->
  <rect x="16" y="16" width="16" height="16" fill="#ff0000" mask="url(#half)"/>
</svg>
