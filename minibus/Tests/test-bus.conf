<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Copyright (c) 2026 Simon Peter / SPDX-License-Identifier: BSD-2-Clause

     Permissive configuration so the real dbus-daemon can serve as the
     reference for the minibus conformance tests: session-like, everything
     allowed, anonymous auth allowed, no activation, generous limits. The
     listen address is given on the command line. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/nonexistent/overridden-by-address-option</listen>
  <auth>EXTERNAL</auth>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
    <allow user="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
  </policy>
  <limit name="max_connections_per_user">4000</limit>
  <limit name="max_completed_connections">4000</limit>
  <limit name="max_incomplete_connections">4000</limit>
  <limit name="max_replies_per_connection">10000</limit>
  <limit name="max_match_rules_per_connection">2000</limit>
  <limit name="max_names_per_connection">2000</limit>
  <limit name="max_outgoing_bytes">8000000</limit>
</busconfig>
